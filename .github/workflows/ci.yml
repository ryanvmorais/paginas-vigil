# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Pipeline de CI (GitHub Actions). Dois jobs independentes, para a falha de um não esconder a
# do outro:
#   qualidade  espelha o pre-commit local (.githooks/pre-commit) e confere o build dos dois
#              sites, sem e com medição: prettier, eslint, typecheck, testes e build. Verde aqui
#              significa o mesmo que verde num clone limpo
#   seguranca  `pnpm audit` sobre o lockfile (as exceções aceitas ficam em pnpm-workspace.yaml)
# O Node vem do `engines` do package.json (>=26) e o pnpm do campo `packageManager`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Somente leitura por padrão; nenhum job precisa de mais.
permissions:
  contents: read

# Um push novo no mesmo PR torna o run anterior inútil; na `main` todo run é mantido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nenhum passo seguinte precisa do token do GitHub; ele não fica no disco.
          persist-credentials: false

      - name: Instalar o pnpm
        # A versão sai do campo `packageManager` do package.json: uma fonte só.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Instalar as dependências
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript e Astro (tsc e astro check)
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build dos dois sites, sem medição
        run: pnpm build

      - name: Build dos dois sites, com medição
        # O identificador de teste liga o modo com medição (banner, controle e script de
        # consentimento) para o `verificar-dist` conferir também esse HTML contra a CSP. É um
        # valor sintético: nenhum identificador real entra no CI.
        run: pnpm build
        env:
          PUBLIC_GA_MEASUREMENT_ID: G-TESTE12345

  seguranca:
    name: seguranca
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nenhum passo seguinte precisa do token do GitHub; ele não fica no disco.
          persist-credentials: false

      - name: Instalar o pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Instalar as dependências
        run: pnpm install --frozen-lockfile

      - name: Auditoria das dependências
        run: pnpm audit

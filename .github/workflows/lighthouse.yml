# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Lighthouse CI sobre o build estático de cada site (`apps/<site>/dist`): mede desempenho,
# acessibilidade, boas práticas e SEO de todas as páginas do build, em celular e em desktop, com
# 3 medições e a mediana. Limites em .github/lighthouse/<site>-{mobile,desktop}.json.
# NÃO é check obrigatório: a nota varia em runner compartilhado. O que ele pega é regressão de
# carga, de acessibilidade e de estrutura antes do deploy.
# O `@lhci/cli` vem por `npx` numa variável, e não como dependência do package.json: a árvore dele
# traz vulnerabilidades altas que derrubariam o `pnpm audit` do CI.
name: Lighthouse CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/lighthouse/**"
      - ".github/workflows/lighthouse.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/lighthouse/**"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

# Somente leitura: o job só mede o build do repositório.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Mais de 7 dias de publicada (0.15.1 saiu em 2025-06-25; a 0.16.0 é de 2026-11-02). O
  # Dependabot não vê `npx`: a revisão desta versão é manual.
  LHCI_VERSION: "0.15.1"
  # Carência de release para o `npx`, em dias: a árvore do `@lhci/cli` é resolvida na hora, sem
  # lockfile. O mesmo prazo do `minimumReleaseAge` do pnpm-workspace.yaml (um teste confere).
  npm_config_min_release_age: "7"

jobs:
  lighthouse:
    name: lighthouse (${{ matrix.site }}, ${{ matrix.modo }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site: [webvigil, mailvigil]
        modo: [mobile, desktop]
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nenhum passo seguinte precisa do token do GitHub; ele não fica no disco.
          persist-credentials: false

      - name: Instalar o pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Instalar as dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar o site
        # Com o identificador de teste a página sai com o banner de consentimento, que na primeira
        # visita fica aberto: é essa a página que o visitante vê e que o Lighthouse precisa medir.
        run: pnpm --filter @paginas-vigil/${{ matrix.site }} build
        env:
          PUBLIC_GA_MEASUREMENT_ID: G-TESTE12345

      - name: Medir e conferir os limites
        run: npx --yes @lhci/cli@${{ env.LHCI_VERSION }} autorun --config=.github/lighthouse/${{ matrix.site }}-${{ matrix.modo }}.json

      - name: Guardar os relatórios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ matrix.site }}-${{ matrix.modo }}
          path: .lighthouseci/${{ matrix.site }}-${{ matrix.modo }}
          retention-days: 14

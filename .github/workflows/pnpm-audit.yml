# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Auditoria semanal de CVE nas dependências (`pnpm audit` sobre o pnpm-lock.yaml).
# Existe porque o CI só roda em PR e o Dependabot nem sempre abre PR de correção: um CVE
# publicado depois do último PR passaria despercebido. Run vermelho = vulnerabilidade conhecida
# no lockfile; o GitHub avisa por e-mail quem editou o cron por último. As exceções aceitas ficam
# em pnpm-workspace.yaml, as mesmas do job `seguranca` do CI.
name: pnpm audit semanal

on:
  schedule:
    # Segunda 09:00 em São Paulo (UTC-3): depois dos PRs do Dependabot de domingo.
    - cron: "0 12 * * 1"
  workflow_dispatch:

# Um run por vez; um disparo manual no meio da semana não se soma ao agendado.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm-audit (CVEs no pnpm-lock.yaml)
    runs-on: ubuntu-26.04
    # Um run normal leva menos de 1 minuto; o teto impede que um job travado gaste a cota.
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar o pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Instalar as dependências
        run: pnpm install --frozen-lockfile

      - name: Auditoria das dependências
        run: pnpm audit

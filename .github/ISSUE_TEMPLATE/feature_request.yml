# Formulário de ideia — lido pelo GitHub ao abrir uma issue nova.
# Uma ideia aceita vira spec em specs/ antes de ser construída.
name: "Sugerir uma ideia"
description: "Sugira algo que as páginas deveriam ter ou explicar melhor"
labels:
  - "enhancement"
body:
  - type: textarea
    id: problema
    attributes:
      label: "O problema"
      description: "O que você procurava na página e não encontrou, ou o que atrapalha hoje?"
    validations:
      required: true

  - type: textarea
    id: ideia
    attributes:
      label: "O que você gostaria"
      description: "Como você imagina isso na página."
    validations:
      required: true

  - type: textarea
    id: alternativas
    attributes:
      label: "Alternativas"
      description: "Opcional. Outros sites ou soluções que você viu."
